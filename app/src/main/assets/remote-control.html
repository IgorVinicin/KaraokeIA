<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0820"><title>SoltaVoz · Escolha sua música</title>
<style>
@font-face{font-family:Manrope;src:url('/fonts/body');font-weight:100 900;font-display:swap}@font-face{font-family:Unbounded;src:url('/fonts/heading');font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--pink:#ff2dab;--muted:#9695aa;--line:#ffffff12;--surface:#211337}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 5%,#39205266,transparent 60%),linear-gradient(135deg,#0d0820,#1e0e38);color:#faf9ff;font:14px Manrope,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ff83c3;outline-offset:4px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.shell{max-width:680px;margin:auto;padding:0 20px 36px;padding-bottom:max(36px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 20px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font:800 16px Unbounded,system-ui}.brand-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--pink);box-shadow:0 0 28px #ff26952a}.connection{display:flex;align-items:center;gap:6px;color:#b8b5c9;font-size:10px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:#777}.online .dot{background:#7de4b1;box-shadow:0 0 8px #7de4b144}
.intro{padding:4px 0 8px}.intro h1{font:800 clamp(19px,5vw,25px)/1.35 Unbounded,system-ui;letter-spacing:-.5px;margin:0}.navigation{position:sticky;top:0;z-index:3;background:#0d0820f5;backdrop-filter:blur(16px);padding:20px 0 14px}.tabs{display:flex;padding:5px;gap:5px;background:#211337;border:1px solid var(--line);border-radius:14px}.tab{flex:1;border:0;border-radius:10px;background:transparent;color:var(--muted);padding:12px 8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:800}.tab[aria-selected=true]{background:#292030;color:#fff;box-shadow:0 2px 6px #0003}.tab[aria-selected=true] svg{color:var(--pink)}.badge{min-width:20px;padding:3px 6px;border-radius:7px;background:var(--pink);color:#fff;font-size:9px}.search{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 14px;background:#211337;border:1px solid #ffffff18;border-radius:13px}.search svg{color:#91879f;width:18px}.search:focus-within{border-color:#ff269580}.search input{width:100%;padding:15px 0;background:transparent;border:0;color:#fff;font-size:13px;outline:none}.search input::placeholder{color:#827a91}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 14px}.section-heading h2{font-size:16px;margin:0;font-weight:800}.subheading{color:var(--muted);font-size:11px;margin:5px 0 0}.text-button{border:0;background:transparent;color:#b6a9bf;display:flex;align-items:center;gap:5px;font-size:11px;padding:10px 0;min-height:44px}.text-button svg{width:15px;height:15px}.text-button.danger{color:#f88caf}
ul{list-style:none;margin:0;padding:0}.song{display:flex;align-items:center;gap:12px;background:linear-gradient(115deg,#26173b,#170d29);border:1px solid var(--line);border-radius:16px;padding:14px 12px;margin-bottom:10px}.art{width:48px;height:48px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--hue) 48% 30%),hsl(var(--hue) 35% 14%));color:hsl(var(--hue) 90% 80%);border:1px solid #ffffff12}.art{position:relative;overflow:hidden}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art svg{width:24px;height:24px}.info{min-width:0;flex:1}.song-title{font-size:13px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.artist{color:#a8a0b5;font-size:11px;margin-top:4px;overflow-wrap:anywhere}.code{display:inline-block;font-size:9px;color:#8c809d;letter-spacing:.8px;margin-top:6px}.add{display:flex;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:44px;background:#ff269518;border:1px solid #ff269540;color:#ff79be;border-radius:12px;padding:10px;font-size:11px;font-weight:800;flex-shrink:0}.add:hover:not(:disabled){background:var(--pink);color:white}.add:disabled{border-color:#ffffff12;color:#8b8297;background:#ffffff05}.add svg{width:16px;height:16px}.position{color:#eebbda;font:700 16px Unbounded;min-width:28px;text-align:center}.queue-card{border-color:#ff269525}.remove{border:1px solid #ffffff12;color:#a891a0;background:#ffffff04;display:grid;place-items:center;min-height:44px;width:44px;border-radius:12px;flex-shrink:0}.remove svg{width:16px}.empty{text-align:center;border:1px dashed #ffffff18;border-radius:18px;padding:35px 22px;color:var(--muted);line-height:1.8}.empty svg{width:35px;height:35px;color:#ff79be;margin-bottom:10px}.empty strong{display:block;color:#ece4f3;font-size:14px}.empty p{font-size:12px;margin:8px 0}.more{width:100%;border:1px solid #ffffff18;background:#16131e;color:#cfbddb;border-radius:12px;min-height:46px;margin-top:8px;font-weight:700;font-size:12px}.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:5;width:max-content;max-width:calc(100% - 32px);background:#34213c;border:1px solid #ff269550;box-shadow:0 8px 32px #0008;border-radius:14px;padding:14px 20px;color:#fff;font-size:12px;pointer-events:none}.toast:empty{display:none}[hidden]{display:none!important}@media(max-width:360px){.shell{padding-left:14px;padding-right:14px}.add .button-label{display:none}.brand{font-size:13px}.song{gap:9px}}</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><span class="brand-icon" id="brand-icon"></span>SoltaVoz</div><div class="connection" id="connection"><span class="dot"></span><span id="connection-label">Conectando</span></div></header>
<section class="intro"><h1>Escolha sua música</h1></section>
<div class="navigation"><div class="tabs" role="tablist" aria-label="Músicas e fila"><button class="tab" id="catalogue-tab" role="tab" aria-controls="catalogue-panel" aria-selected="true"><span data-icon="music"></span>Escolher música</button><button class="tab" id="queue-tab" role="tab" aria-controls="queue-panel" aria-selected="false"><span data-icon="queue"></span>Minha fila<span class="badge" id="queue-count">0</span></button></div><label class="search" id="search-box"><span data-icon="search"></span><input id="search" type="search" aria-label="Buscar música, artista ou código" placeholder="Música, artista ou código..." autocomplete="off"></label></div>
<section id="catalogue-panel" role="tabpanel" aria-labelledby="catalogue-tab"><div class="section-heading"><div><h2>Músicas</h2><p class="subheading" id="results-label">Carregando músicas...</p></div><button class="text-button" id="refresh"><span data-icon="refresh"></span>Atualizar</button></div><ul id="songs"><li class="empty">Carregando catálogo...</li></ul><button class="more" id="more" hidden>Mostrar mais músicas</button></section>
<section id="queue-panel" role="tabpanel" aria-labelledby="queue-tab" hidden><div class="section-heading"><div><h2>Fila de músicas</h2></div><button class="text-button danger" id="clear" hidden>Limpar fila</button></div><ul id="queue"></ul><button class="more" id="choose">Escolher mais músicas</button></section>
</main><div class="toast" id="status" role="status" aria-live="polite"></div>
<script>
const paths={music:'<path d="M9 18V5l12-2v13M9 8l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',queue:'<path d="M4 5h16M4 11h10M4 17h8m5-3 4 3-4 3z"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>';
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));document.getElementById('brand-icon').innerHTML=icon('mic');
const el=id=>document.getElementById(id);let songs=[],queue=[],limit=20,toastTimer,queueSnapshot=null,queueBusy=false,loading=false;const pending=new Set();
const normalize=value=>String(value).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function notify(message){clearTimeout(toastTimer);el('status').textContent=message;toastTimer=setTimeout(()=>el('status').textContent='',4500)}
function connection(online){el('connection').classList.toggle('online',online);el('connection-label').textContent=online?'Conectado':'Sem conexão'}
async function api(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),path==='/api/songs'?240000:20000);try{const response=await fetch(path,{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('Falha na conexão');const data=await response.json();connection(true);return data} catch(error){connection(false);throw error}finally{clearTimeout(timer)}}
function tab(name){const catalogue=name==='catalogue';el('catalogue-panel').hidden=!catalogue;el('queue-panel').hidden=catalogue;el('search-box').hidden=!catalogue;el('catalogue-tab').setAttribute('aria-selected',String(catalogue));el('queue-tab').setAttribute('aria-selected',String(!catalogue))}
function text(tag,className,value){const node=document.createElement(tag);node.className=className;node.textContent=value;return node}
function empty(list,title,description){const item=document.createElement('li');item.className='empty';item.innerHTML=icon('mic');item.append(text('strong','',title),text('p','',description));list.replaceChildren(item)}
// Observe visible cards only, with a shared three-request budget and session reuse.
const artworkResults=new Map(),artworkWaiting=[],artworkQueued=new Set();let artworkActive=0;
const artworkObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;artworkObserver.unobserve(entry.target);requestArt(entry.target)}},{rootMargin:'80px'});
function installArt(art,url){if(!url||!art.isConnected)return;const img=document.createElement('img');img.alt='';img.decoding='async';img.width=128;img.height=128;img.src=url;img.onerror=()=>img.remove();art.append(img)}
function requestArt(art){const code=art.dataset.code;if(code.startsWith('youtube:')){const id=code.slice(8);if(/^[A-Za-z0-9_-]{11}$/.test(id))installArt(art,'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg');return}if(artworkResults.has(code)){installArt(art,artworkResults.get(code));return}if(!artworkQueued.has(code)){artworkQueued.add(code);artworkWaiting.push(code)}pumpArt()}
function pumpArt(){while(artworkActive<3&&artworkWaiting.length){const code=artworkWaiting.shift();if(![...document.querySelectorAll('.art')].some(art=>art.dataset.code===code)){artworkQueued.delete(code);continue}artworkActive++;fetch('/api/artwork?code='+encodeURIComponent(code)).then(async response=>{if(response.status===503){artworkQueued.delete(code);setTimeout(()=>document.querySelectorAll('.art').forEach(art=>{if(art.dataset.code===code)artworkObserver.observe(art)}),1500);return}const url=response.ok?URL.createObjectURL(await response.blob()):null;artworkResults.set(code,url);if(artworkResults.size>256){const oldest=artworkResults.keys().next().value;const previous=artworkResults.get(oldest);if(previous)URL.revokeObjectURL(previous);artworkResults.delete(oldest)}document.querySelectorAll('.art').forEach(art=>{if(art.dataset.code===code)installArt(art,url)})}).catch(()=>{artworkQueued.delete(code)}).finally(()=>{artworkActive--;pumpArt()})}}
function observeArtwork(list){list.querySelectorAll('.art').forEach(art=>artworkObserver.observe(art))}
function card(song,index){const item=document.createElement('li');item.className='song'+(index!==undefined?' queue-card':'');if(index!==undefined)item.append(text('span','position',String(index+1)));{const art=document.createElement('div');art.className='art';art.dataset.code=song.code;art.style.setProperty('--hue',String([...song.artist].reduce((n,c)=>n+c.charCodeAt(0),0)%360));art.innerHTML=icon('music');item.append(art)}const info=document.createElement('div');info.className='info';info.append(text('div','song-title',song.title),text('div','artist',song.artist),text('span','code',song.code.startsWith('youtube:')?'YOUTUBE':'CÓD. '+song.code));item.append(info);const button=document.createElement('button');if(index!==undefined){button.className='remove';button.innerHTML=icon('close');button.setAttribute('aria-label','Remover '+song.title+' da fila');button.onclick=()=>mutate('/api/remove?code='+encodeURIComponent(song.code),'Música removida da fila.',button)}else{const queued=queue.some(entry=>entry.code===song.code);button.className='add';button.disabled=queued||pending.has(song.code);button.innerHTML=icon(queued?'check':'plus');button.append(text('span','button-label',queued?'Na fila':pending.has(song.code)?'Adicionando':'Adicionar'));button.setAttribute('aria-label',(queued?'Na fila: ':'Adicionar à fila: ')+song.title);button.onclick=()=>add(song.code,button)}item.append(button);return item}
function renderSongs(){artworkObserver.disconnect();const query=normalize(el('search').value.trim()),filtered=songs.filter(song=>normalize(song.title+' '+song.artist+' '+song.code).includes(query));el('results-label').textContent=query?filtered.length+' resultados encontrados':songs.length+' músicas para escolher';el('songs').replaceChildren(...filtered.slice(0,limit).map(song=>card(song)));if(!filtered.length)empty(el('songs'),'Nenhuma música encontrada','Tente outro título, artista ou código.');el('more').hidden=filtered.length<=limit;observeArtwork(el('songs'));observeArtwork(el('queue'))}
function updateQueue(list){queue=list;el('queue-count').textContent=String(list.length);el('clear').hidden=!list.length;const snapshot=JSON.stringify(list);if(snapshot!==queueSnapshot){queueSnapshot=snapshot;el('queue').replaceChildren(...list.map((song,index)=>card(song,index)));if(!list.length)empty(el('queue'),'Sua fila está vazia','Adicione músicas pelo catálogo.');observeArtwork(el('queue'));if(songs.length)renderSongs()}}
async function refreshQueue(){if(queueBusy)return;queueBusy=true;try{updateQueue(await api('/api/queue'))}catch(error){/* connection indicator explains unavailable server */}finally{queueBusy=false}}
async function mutate(path,message,button){button.disabled=true;try{updateQueue(await api(path));notify(message)}catch(error){notify('Não foi possível atualizar a fila. Tente novamente.')}finally{button.disabled=false}}
async function add(code,button){if(pending.has(code))return;pending.add(code);button.disabled=true;try{updateQueue(await api('/api/add?code='+encodeURIComponent(code)));notify('Música adicionada à fila.')}catch(error){notify('Não foi possível adicionar. Confira a conexão.')}finally{pending.delete(code);renderSongs()}}
async function loadAll(){if(loading)return;loading=true;el('refresh').disabled=true;el('results-label').textContent='Carregando catálogo...';try{songs=await api('/api/songs');renderSongs();await refreshQueue()}catch(error){el('results-label').textContent='Catálogo indisponível';empty(el('songs'),'Não conseguimos carregar as músicas','Confira a conexão e toque em Atualizar.')}finally{loading=false;el('refresh').disabled=false}}
el('catalogue-tab').onclick=()=>tab('catalogue');el('queue-tab').onclick=()=>tab('queue');el('choose').onclick=()=>{tab('catalogue');el('search').focus()};el('search').oninput=()=>{limit=20;renderSongs()};el('more').onclick=()=>{limit+=20;renderSongs()};el('refresh').onclick=loadAll;el('clear').onclick=()=>{if(confirm('Remover todas as músicas da fila?'))mutate('/api/clear','Fila limpa.',el('clear'))};refreshQueue();loadAll();setInterval(refreshQueue,3000);
</script></body></html>
